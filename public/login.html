<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%2322262B%22/%3E%3Cpath d=%22M6 24V8h4l6 9 6-9h4v16h-4V15l-6 8-6-8v9z%22 fill=%22%23F5B800%22/%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Montagsa</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="login">
    <section class="login-lado">
        <div class="contenido">
            <h1>MONTAGSA</h1>
            <p>Sistema interno de renta, venta y servicio de montacargas.</p>
            <ul>
                <li><strong>Almacén</strong>flota, inventario, máximos y mínimos</li>
                <li><strong>Comercial</strong>rentas, servicios, facturación y traspasos</li>
                <li><strong>Administración</strong>compras, cobranza, créditos, RRHH y contabilidad</li>
            </ul>
        </div>
        <div class="franja" aria-hidden="true"></div>
    </section>
    <section class="login-form">
        <form id="form-login" novalidate>
            <h2>Iniciar sesión</h2>
            <div class="campo"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
            <div class="campo"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
            <button class="btn btn-primario" type="submit" id="btn-entrar">Entrar</button>
            <p class="tenue" id="login-error" role="alert" style="min-height:1.4em"></p>
        </form>
    </section>
</div>
<script src="/js/core.js"></script>
<script>
if (Sesion.token()) location.replace('/dashboard.html');
document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-entrar');
    const err = document.getElementById('login-error');
    err.textContent = '';
    btn.disabled = true;
    try {
        const r = await api('/auth/login', { method: 'POST', body: {
            email: document.getElementById('email').value, password: document.getElementById('password').value } });
        Sesion.guardar(r);
        location.href = '/dashboard.html';
    } catch (ex) {
        err.textContent = ex.message;
        err.style.color = 'var(--rojo)';
    } finally { btn.disabled = false; }
});
</script>
</body>
</html>
